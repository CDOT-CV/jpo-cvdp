name: jpo-cvdp
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [develop, master]

jobs:
  jpo-cvdp:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
      env:
        REDACTION_PROPERTIES_PATH: "/__w/jpo-cvdp/jpo-cvdp/config/fieldsToRedact.txt"  # This env vairable is used to run ppm test
        BUILD_WRAPPER_OUT_DIR: "$GITHUB_WORKSPACE/bw-output" # Output directory used by the Sonar Build Wrapper
      options: "--user root"
    steps:
      - name: checkout code
        uses: actions/checkout@v4 # This action to checkout the code
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git pkg-config ca-certificates wget curl gnupg \
            lsb-release gcovr unzip libcurl4-openssl-dev libsasl2-dev libsasl2-modules \
            libssl-dev liblz4-dev libzstd-dev zlib1g-dev libprotobuf-dev protobuf-compiler
      - name: Install librdkafka
        run: |
          sh scripts/install_librdkafka.sh
          ldconfig
      - name: Install Sonar Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
      - name: Build and Generate test coverage
        run: |
          cd $GITHUB_WORKSPACE
          chmod   755  -R /__w/jpo-cvdp/jpo-cvdp
          cat /usr/include/asm-generic/signal.h
          cat /usr/include/x86_64-linux-gnu/asm/signal.h
          export LD_LIBRARY_PATH=/usr/local/lib 
          build-wrapper-linux-x86-64 --out-dir $GITHUB_WORKSPACE/bw-output ./build.sh     
          mkdir coverage
          cd coverage 
          # Collect only files compiled into the coverage targets, including nested sources.
          find "$GITHUB_WORKSPACE/build/cv-lib/CMakeFiles/CVLib.dir" \
            "$GITHUB_WORKSPACE/build/CMakeFiles/ppm_tests.dir" \
            -type f -name '*.gcno' -exec gcov --preserve-paths {} +
      - name: Archive code coverage results
        uses: actions/upload-artifact@v4 # This action is used to capture the test artifacts and exits if no files are found
        with:
          name: jpo-cvdp-code-coverage
          path: /__w/jpo-cvdp/jpo-cvdp/coverage/
          if-no-files-found: error              
      - name: Archive buildwrapper output
        uses: actions/upload-artifact@v4  # This action is used to capture the builwrapper output files used by sonarscan.
        with: 
          name: jpo-cvdp-buildwrapper-output
          path: /home/runner/work/jpo-cvdp/jpo-cvdp/bw-output       
      - name: Check Sonar availability
        id: sonar
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate sonar properties file
        if: steps.sonar.outputs.enabled == 'true'
        run: |
          cat <<EOF > /tmp/sonar-scanner.properties
          sonar.host.url=https://sonarcloud.io
          sonar.projectName=jpo-cvdp
          sonar.projectVersion=1.0
          sonar.projectKey=${{ github.repository_owner }}_jpo-cvdp
          sonar.organization=${{ vars.SONAR_ORGANIZATION || github.repository_owner }}
          sonar.sources=.
          sonar.cfamily.build-wrapper-output=bw-output
          sonar.cfamily.gcov.reportsPath=/__w/jpo-cvdp/jpo-cvdp/coverage/
          sonar.projectBaseDir=$GITHUB_WORKSPACE
          # Build artifacts are inputs to coverage analysis, not additional source files.
          sonar.exclusions=**/*.java,build/**,bw-output/**,coverage/**
          sonar.coverage.exclusions=**/*.java
          # Set Git as SCM sensor
          sonar.scm.disabled=true
          #sonar.scm.enabled=false
          sonar.scm.provider=git
          sonar.sourceEncoding=UTF-8
          EOF
      - name: Run SonarScanner
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dproject.settings=/tmp/sonar-scanner.properties
